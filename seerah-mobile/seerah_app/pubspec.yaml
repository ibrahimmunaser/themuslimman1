name: seerah_app
description: "The Muslim Man — Seerah Course Mobile App"
publish_to: 'none'
version: 1.0.93+97

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  archive: ^4.0.9

  # Navigation
  go_router: ^14.0.0

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP + Cookies
  dio: ^5.7.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Media
  video_player: ^2.9.2
  chewie: ^1.8.5
  cached_network_image: ^3.4.1

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3

  # In-App Purchases (Apple StoreKit + Google Play Billing Library 8+)
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.5.0

  # Utils
  shared_preferences: ^2.5.3

  # Splash (runtime: main.dart calls FlutterNativeSplash.preserve/remove)
  flutter_native_splash: ^2.4.3
  webview_flutter: ^4.13.0
  flutter_markdown_plus: ^1.0.7
  share_plus: ^12.0.2
  screenshot: ^3.0.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  intl: ^0.20.2
  package_info_plus: ^9.0.1

  # ── Salah (prayer times, reminders, App Guard, Quran, Qibla) ──────────────
  # Merged from the standalone "Allah Is Calling" app.
  provider: ^6.1.5+1
  adhan_dart: ^2.0.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  geolocator: ^14.0.2
  lat_lng_to_timezone: ^0.2.0
  geocoding: ^4.0.0
  device_info_plus: ^12.4.0
  vibration: ^3.1.8
  hijri: ^3.0.1
  flutter_compass: ^0.8.1
  http: ^1.6.0
  audioplayers: ^6.6.0
  scrollable_positioned_list: ^0.3.8
  confetti: ^0.8.0
  google_mlkit_translation: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# ── App icon configuration ────────────────────────────────────────────────────
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  # Square gold mark on pure black — used for Android/iOS/macOS launcher icons
  image_path: "assets/images/app_icon.png"

  android: true
  ios: true
  min_sdk_android: 23

  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_icon.png"

  remove_alpha_ios: true

# ── Native splash screen configuration ───────────────────────────────────────
# Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"

  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png

  android_12:
    color: "#000000"
    color_dark: "#000000"
    image: assets/images/splash_logo.png
    image_dark: assets/images/splash_logo.png
    icon_background_color: "#000000"
    icon_background_color_dark: "#000000"

  # Keep the splash visible until Flutter calls
  # FlutterNativeSplash.remove() — triggered in main.dart after init.
  fullscreen: true
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/i18n/
    - assets/facts/
    - assets/facts/i18n/
    # Salah features merged from the standalone "Allah Is Calling" app.
    # Offline city database built from GeoNames (CC BY 4.0, geonames.org).
    # NOTE: extension is deliberately NOT ".gz" -- Google Play's app bundle
    # serving pipeline silently strips the ".gz" extension and
    # decompresses/re-deflates any asset ending in ".gz" (a longstanding
    # AAPT/Play packaging special-case for gzip-named assets), which broke
    # the hardcoded rootBundle.load() path for every Play Store install
    # while sideloaded APKs (never touched by Play's pipeline) kept working.
    # The bytes are still gzip-compressed; CityDatabase gunzips them itself.
    - assets/geonames/cities.tsv.gzdat
    # Locally bundled tafsir: one small text file per verse.
    - assets/tafsir/surah_001/
    # Guard-screen backdrops (native Android GuardBlockActivity reads these
    # directly from the Flutter asset bundle — see its loadHero()).
    - assets/incoming_call/
